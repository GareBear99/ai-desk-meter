<svg xmlns="http://www.w3.org/2000/svg" width="160" height="110" viewBox="0 0 160 110" role="img" aria-labelledby="title desc">
  <title id="title">AI Desk Meter pixel buddy</title>
  <desc id="desc">Orange pixel buddy with blue feet and Musing status baseline.</desc>
  <rect width="160" height="110" rx="18" fill="#05070b"/>
  <g transform="translate(42 16)" shape-rendering="crispEdges">
    <style>.o{fill:#ff7048}.d{fill:#ff9a5f}.b{fill:#67b7ff}.e{fill:#ffd6aa}</style>
    <!-- 10 x 5 pixel buddy, hardware-friendly baseline -->
    <rect class="o" x="16" y="0" width="8" height="8" rx="2"/><rect class="o" x="26" y="0" width="8" height="8" rx="2"/><rect class="o" x="36" y="0" width="8" height="8" rx="2"/><rect class="o" x="46" y="0" width="8" height="8" rx="2"/><rect class="o" x="56" y="0" width="8" height="8" rx="2"/><rect class="o" x="66" y="0" width="8" height="8" rx="2"/>
    <rect class="o" x="6" y="10" width="8" height="8" rx="2"/><rect class="o" x="16" y="10" width="8" height="8" rx="2"/><rect id="museEyeLeft" class="e muse-eye" x="26" y="10" width="8" height="8" rx="2"/><rect class="o" x="36" y="10" width="8" height="8" rx="2"/><rect class="o" x="46" y="10" width="8" height="8" rx="2"/><rect id="museEyeRight" class="e muse-eye" x="56" y="10" width="8" height="8" rx="2"/><rect class="o" x="66" y="10" width="8" height="8" rx="2"/><rect class="o" x="76" y="10" width="8" height="8" rx="2"/>
    <rect class="o" x="0" y="20" width="8" height="8" rx="2"/><rect class="o" x="10" y="20" width="8" height="8" rx="2"/><rect class="o" x="20" y="20" width="8" height="8" rx="2"/><rect class="o" x="30" y="20" width="8" height="8" rx="2"/><rect class="o" x="40" y="20" width="8" height="8" rx="2"/><rect class="o" x="50" y="20" width="8" height="8" rx="2"/><rect class="o" x="60" y="20" width="8" height="8" rx="2"/><rect class="o" x="70" y="20" width="8" height="8" rx="2"/><rect class="o" x="80" y="20" width="8" height="8" rx="2"/><rect class="o" x="90" y="20" width="8" height="8" rx="2"/>
    <rect class="o" x="20" y="30" width="8" height="8" rx="2"/><rect class="o" x="30" y="30" width="8" height="8" rx="2"/><rect class="o" x="40" y="30" width="8" height="8" rx="2"/><rect class="o" x="50" y="30" width="8" height="8" rx="2"/><rect class="o" x="60" y="30" width="8" height="8" rx="2"/><rect class="o" x="70" y="30" width="8" height="8" rx="2"/>
    <rect class="b" x="6" y="42" width="8" height="8" rx="2"/><rect class="b" x="16" y="42" width="8" height="8" rx="2"/><rect class="b" x="76" y="42" width="8" height="8" rx="2"/><rect class="b" x="86" y="42" width="8" height="8" rx="2"/>
  </g>
  <text id="buddyStatusLabel" x="80" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffd6aa">No Muse.</text>
</svg>
