name: ai-desk-meter-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "host[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run no-server CLI smoke checks
        run: |
          ai-meter version
          ai-meter providers
          ai-meter doctor --provider mock
          mkdir -p runtime
          ai-meter write-status --provider mock --out runtime/status.json
          ai-meter write-companion --provider mock --out runtime/companion.json
          test -s runtime/status.json
          test -s runtime/companion.json
