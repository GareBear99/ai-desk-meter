[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desk-meter"
version = "1.2.1"
description = "Local-first AI workflow meter, Arc-RAR dashboard bridge, offline-first file/stdout/serial payload flow, optional diagnostics API, Raspberry Pi/SBC host path, and ESP32/Arduino companion display protocol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31"
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ai-meter = "ai_meter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_meter*"]
