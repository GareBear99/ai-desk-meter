[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desk-meter"
version = "0.3.0"
description = "Local-first host daemon for AI workflow, Arc-RAR, Raspberry Pi, ESP32, and companion display dashboards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31"
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ai-meter = "ai_meter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_meter*"]
